[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }}{% else %}## Não lançado{% endif %}
{% if commits | length == 0 %}
Sem mudanças listadas nesta versão.
{% endif %}
{% set groups = ["Novidades", "Melhorias", "Correções", "Ajustes"] %}
{% for group in groups %}
{% set items = commits | filter(attribute="group", value=group) %}
{% if items | length > 0 %}
### {{ group }}
{% for commit in items %}
- {% if commit.breaking %}**Exige atualizar:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endif %}
{% endfor %}
"""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
sort_commits = "newest"
commit_parsers = [
  { message = '^feat(\([^)]+\))?!?:', group = "Novidades" },
  { message = '^(perf|improve)(\([^)]+\))?!?:', group = "Melhorias" },
  { message = '^fix(\([^)]+\))?!?:', group = "Correções" },
  { message = '^(ui|style|refactor)(\([^)]+\))?!?:', group = "Ajustes" },
  { message = '.*', skip = true },
]
