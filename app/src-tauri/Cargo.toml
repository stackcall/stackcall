[package]
name = "stackcall"
version = "0.6.1"
edition = "2021"

[lib]
name = "stackcall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
dunce = "1"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
