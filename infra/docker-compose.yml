services:
  livekit:
    # LiveKit Server v1.13.11
    image: livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: ["--config", "/etc/livekit.yaml"]
    networks:
      porteiro:
        ipv4_address: 172.31.240.4
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?configure LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?configure LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped

  porteiro:
    # Imagem local, com bases fixadas por digest no Dockerfile.
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?configure LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?configure LIVEKIT_API_SECRET}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?configure LIVEKIT_PUBLIC_URL}
      PORTEIRO_DB: /data/stackcall.sqlite3
      SERVIDOR_URL: ${SERVIDOR_URL:-http://localhost:8100}
      SERVIDOR_NOME: ${SERVIDOR_NOME:-Stackcall}
      MEMBROS_CONVIDAM: ${MEMBROS_CONVIDAM:-false}
      PORTEIRO_ADDR: ${PORTEIRO_ADDR:-0.0.0.0:8100}
      PORTEIRO_TRUSTED_PROXY: ${PORTEIRO_TRUSTED_PROXY:-172.31.240.1}
    ports:
      - "127.0.0.1:8100:8100"
    networks:
      - porteiro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 64
    volumes:
      - porteiro-data:/data
    mem_limit: 96m
    restart: unless-stopped

networks:
  porteiro:
    ipam:
      config:
        - subnet: 172.31.240.0/29
          gateway: 172.31.240.1

volumes:
  porteiro-data:
