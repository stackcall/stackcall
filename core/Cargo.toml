[package]
name = "stackcall-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
png = "0.18"
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["format", "filter", "software-scaling"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows-capture = "=2.0.1"
livekit = { version = "=0.12.0", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
wasapi = "=0.27.0"
nvml-wrapper = "0.12"
