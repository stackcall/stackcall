name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: Versão do app (X.Y.Z ou X.Y.Z-teste.1) para testar a build
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: ${{ hashFiles('app/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: app/package-lock.json

      - name: Conferir versão do app
        id: version
        env:
          INPUT_VERSION: ${{ inputs.versao }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_VERSION
          } else {
            $env:GITHUB_REF_NAME.Substring(1)
          }
          if (!$version) { throw 'Informe uma versão no formato X.Y.Z.' }
          node scripts/versao.mjs --check $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Instalar git-cliff
        env:
          CLIFF_VERSION: '2.14.2'
        run: |
          $archive = "$env:RUNNER_TEMP/git-cliff.zip"
          $url = "https://github.com/orhun/git-cliff/releases/download/v$env:CLIFF_VERSION/git-cliff-$env:CLIFF_VERSION-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '6ece2112b3f4af462190ecbea4aeb1315fff6af415629b597f84319073c31131') {
            throw 'SHA-256 do git-cliff não confere.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/git-cliff-$env:CLIFF_VERSION" >> $env:GITHUB_PATH

      - name: Gerar notas da versão
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $manualNotes = "docs/release-notes/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $manualNotes -PathType Leaf) {
            Copy-Item -LiteralPath $manualNotes -Destination release-notes.md
          } else {
            $range = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              @('--unreleased', '--tag', $env:RELEASE_TAG)
            } else {
              @('--current')
            }
            git-cliff --offline --use-branch-tags @range --strip header --output release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath release-notes.md -Raw))) {
              'Sem mudanças listadas nesta versão.' | Set-Content -LiteralPath release-notes.md
            }
          }

      - name: Gerar histórico para o app
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = @()
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = @('--tag', $env:RELEASE_TAG)
          }
          git-cliff --offline --use-branch-tags @tag --context --output cliff-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/changelog-json.mjs cliff-context.json $env:RELEASE_TAG

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            app/src-tauri
            . -> ${{ runner.temp }}/sc-target

      - run: npm ci
        working-directory: app

      - name: Preparar FFmpeg LGPL e compilar o sidecar x64
        run: ./scripts/preparar-ffmpeg.ps1

      - name: Compilar instalador NSIS sem assinatura
        working-directory: app
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii src-tauri/release.conf.json
          npm run tauri build -- --bundles nsis --config src-tauri/release.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -File src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if ($installers.Count -ne 1) { throw 'A build precisa gerar um instalador NSIS x64.' }
          $bytes = $installers[0].Length
          "Instalador NSIS: $bytes bytes ($([Math]::Round($bytes / 1MB, 2)) MiB)" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackcall-nsis
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            release-notes.md
            changelog.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stackcall-nsis
          path: ${{ runner.temp }}/nsis

      - name: Instalar o assinador do Tauri
        run: |
          $archive = "$env:RUNNER_TEMP/tauri-cli.zip"
          $url = 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.6/cargo-tauri-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '39636fa68bc00f13dd610fb57688f292e93742978cc35395f2f1be7c540b88a1') {
            throw 'SHA-256 do assinador do Tauri não confere.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/tauri-cli"

      - name: Assinar o instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Configure a chave e a senha de assinatura no ambiente release.'
          }
          $installers = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/nsis" -Recurse -File -Filter '*_x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Esperado um instalador NSIS x64.' }
          $installer = $installers[0]
          & "$env:RUNNER_TEMP/tauri-cli/cargo-tauri.exe" tauri signer sign --app-version $env:GITHUB_REF_NAME.Substring(1) $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath "$($installer.FullName).sig" -PathType Leaf)) {
            throw 'A assinatura do instalador não foi gerada.'
          }

      - name: Publicar instalador, manifesto e changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (!$env:GH_TOKEN) { throw 'Configure RELEASES_TOKEN no ambiente release.' }
          $repo = 'stackcall/releases'
          $tag = $env:GITHUB_REF_NAME
          $inputDir = "$env:RUNNER_TEMP/nsis"
          $installer = Get-ChildItem -LiteralPath $inputDir -Recurse -File -Filter '*_x64-setup.exe'
          $notes = Join-Path $inputDir 'release-notes.md'
          $changelog = Join-Path $inputDir 'changelog.json'
          $signature = (Get-Content -LiteralPath "$($installer.FullName).sig" -Raw).Trim()
          if (!$signature) { throw 'A assinatura do instalador está vazia.' }
          $manifest = Join-Path $env:RUNNER_TEMP 'latest.json'
          @{
            version = $tag.Substring(1)
            notes = Get-Content -LiteralPath $notes -Raw
            pub_date = [DateTimeOffset]::UtcNow.ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                url = "https://github.com/$repo/releases/download/$([Uri]::EscapeDataString($tag))/$([Uri]::EscapeDataString($installer.Name))"
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifest -Encoding utf8

          $existing = gh release view $tag --repo $repo --json isDraft,tagName
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft -or $release.tagName -cne $tag) {
              throw 'A versão já está publicada ou o rascunho tem outra tag.'
            }
          } else {
            $options = @()
            if ($tag.Contains('-')) { $options += '--prerelease' }
            gh release create $tag --repo $repo --target main --draft --title "Stackcall $tag" --notes-file $notes @options
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag $installer.FullName "$($installer.FullName).sig" $manifest $changelog --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false --notes-file $notes
