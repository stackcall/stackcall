name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      windows_core: ${{ steps.core.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar mudanças no núcleo Windows
        id: core
        if: hashFiles('core/Cargo.toml') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- core/ app/src-tauri/ scripts/preparar-ffmpeg.ps1 .github/workflows/ci.yml .github/workflows/release.yml Cargo.toml Cargo.lock NOTICE)
          if [[ -n "$changed" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Conferir formatação e testar o workspace Rust
        run: |
          cargo fmt --all --check
          members=$(cargo metadata --format-version 1 --no-deps)
          core=$(jq -r --arg manifest "$GITHUB_WORKSPACE/core/Cargo.toml" \
            '.packages[] | select(.manifest_path == $manifest) | .name' <<< "$members")
          workspace=(--workspace)
          if [[ -n "$core" ]]; then
            workspace+=(--exclude "$core")
          fi
          cargo clippy "${workspace[@]}" -- -D warnings
          cargo test "${workspace[@]}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: ${{ hashFiles('app/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: app/package-lock.json

      - run: node scripts/versao.mjs --check

      - name: Compilar e testar o frontend
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test

  core-windows:
    needs: checks
    if: needs.checks.outputs.windows_core == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            app/src-tauri
            . -> ${{ runner.temp }}/sc-target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - name: Testar workspace Windows
        run: |
          ./scripts/preparar-ffmpeg.ps1 -OnlyDownload
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'sc-target'
          $env:RUSTFLAGS = '-C target-feature=+crt-static -C link-arg=/STACK:16777216'
          cargo clippy --locked --release --workspace -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --workspace
      - name: Compilar instalador NSIS sem assinatura do updater
        working-directory: app
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii src-tauri/ci.conf.json
          npm run tauri build -- --config src-tauri/ci.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          if (!$installer) { throw 'Instalador NSIS x64 ausente.' }
          "Instalador NSIS: $($installer.Length) bytes ($([Math]::Round($installer.Length / 1MB, 2)) MiB)" >> $env:GITHUB_STEP_SUMMARY
